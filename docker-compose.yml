# ChatHub 一键 docker-compose 部署（阿里云 ECS / 轻量应用服务器通用）
# 使用：
#   1. 把整个 chat-hub 目录上传到服务器
#   2. 在 chat-hub 目录下执行：docker compose up -d
#   3. 访问 http://服务器公网IP:8787 → 直接进入网页版登录页
#   4. 注册用户名「admin」自动成为首任管理员
#
# 说明：
#   - 数据库文件和上传的图片保存在 ./backend/data/（持久化，重启容器不会丢）
#   - 默认公网端口 8787，和本地开发一致，改下面 ports: 的第一个数字即可换端口
#   - 若 ECS 安全组限制外部访问，记得放行 8787/TCP
version: "3.9"

services:
  chathub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chathub
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
      - PORT=8787
      - HOST=0.0.0.0
      # 可选：初始管理员用户名（默认 admin，注册该用户名自动成为管理员）
      - ADMIN_BOOTSTRAP=admin
    volumes:
      - ./backend/data:/app/data:rw
